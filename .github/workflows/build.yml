name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organizar arquivos
        run: |
          P=app/src/main/java/com/lucas/catsbot
          mkdir -p $P app/src/main/res/xml app/src/main/res/values
          mv -f AndroidManifest.xml app/src/main/ 2>/dev/null || true
          mv -f *.kt $P/ 2>/dev/null || true
          mv -f accessibility_config.xml app/src/main/res/xml/ 2>/dev/null || true
          mv -f strings.xml app/src/main/res/values/ 2>/dev/null || true
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "CatsBot"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.lucas.catsbot"
              compileSdk = 34
              defaultConfig { applicationId = "com.lucas.catsbot"; minSdk = 30; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          find . -path ./.git -prune -o -type f -print | sort
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CatsBot-apk
          path: app/build/outputs/apk/debug/app-debug.apk
